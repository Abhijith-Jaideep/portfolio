<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>AJ</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e82338"/>
      <stop offset="1" stop-color="#9d0f1b"/>
    </linearGradient>
  </defs>

  <!-- Angular badge: cut top-right and bottom-left, matching the site's clip-panel silhouette -->
  <path d="M2 2 H50 L62 14 V62 H14 L2 50 Z" fill="url(#badge)" />
  <path d="M2 2 H50 L62 14 V62 H14 L2 50 Z" fill="none" stroke="#f0b429" stroke-width="3.5" />

  <!-- Gold energy slash behind the monogram, kept faint so it does not
       muddy the letterforms at 16px -->
  <path d="M8 52 L52 10" stroke="#f0b429" stroke-width="2.6" opacity="0.3" stroke-linecap="round" />

  <!-- AJ monogram -->
  <g fill="none" stroke="#ffffff" stroke-linecap="butt" stroke-linejoin="miter">
    <polyline points="12,45 21.5,21 31,45" stroke-width="6" />
    <path d="M16 37 H27" stroke-width="4.6" />
    <path d="M48.5 21 V34.5 a7.5 7.5 0 0 1 -13.2 4.8" stroke-width="6" />
  </g>
</svg>
